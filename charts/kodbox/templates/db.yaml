{{- if .Values.db.enabled }}
{{- $sel := dict "ctx" . "component" "db" "v" .Values.db }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  {{- include "kodbox.annotations" (dict "ctx" $ "extra" .Values.db.service.annotations) | nindent 2 }}
spec:
  selector:
    {{- include "kodbox.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: mysql
      port: {{ .Values.db.service.port }}
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  {{- include "kodbox.annotations" (dict "ctx" $ "extra" nil) | nindent 2 }}
spec:
  revisionHistoryLimit: {{ include "kodbox.revisionHistoryLimit" . }}
  serviceName: {{ include "kodbox.componentName" $sel }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kodbox.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kodbox.podLabels" $sel | nindent 8 }}
      {{- with .Values.db.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "kodbox.podScheduling" $sel | nindent 6 }}
      containers:
        - name: mariadb
          image: {{ include "kodbox.image" (dict "ctx" $ "image" .Values.db.image) }}
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          {{- with .Values.db.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.db.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: MARIADB_DISABLE_UPGRADE_BACKUP
              value: "1"
            {{- with (include "kodbox.extraEnv" $sel | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "kodbox.dbSecretName" . }}
          ports:
            - name: mysql
              containerPort: 3306
          # healthcheck.sh ships with the MariaDB image.
          {{- include "kodbox.probe" (dict "name" "startupProbe" "default" `exec:
  command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
periodSeconds: 10
failureThreshold: 30` "override" .Values.db.startupProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "livenessProbe" "default" `exec:
  command: ["healthcheck.sh", "--connect"]
periodSeconds: 20
timeoutSeconds: 5` "override" .Values.db.livenessProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "readinessProbe" "default" `exec:
  command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
periodSeconds: 10
timeoutSeconds: 5` "override" .Values.db.readinessProbe) | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            {{- with .Values.db.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.db.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with (include "kodbox.extraContainers" (dict "v" .Values.db) | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- if or .Values.db.persistence.existingClaim .Values.db.extraVolumes }}
      volumes:
        {{- with .Values.db.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
        {{- with .Values.db.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if not .Values.db.persistence.existingClaim }}
  # Keep data volumes when the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.db.persistence.accessModes | nindent 10 }}
        {{- include "kodbox.storageClass" (dict "ctx" $ "sc" .Values.db.persistence.storageClass) | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.db.persistence.size }}
  {{- end }}
{{- end }}
