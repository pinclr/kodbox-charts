{{- if .Values.milvus.enabled }}
{{- $sel := dict "ctx" . "component" "etcd" "v" .Values.milvus.etcd }}
{{- $v := .Values.milvus.etcd }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
spec:
  selector:
    {{- include "kodbox.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: client
      port: 2379
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
spec:
  serviceName: {{ include "kodbox.componentName" $sel }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kodbox.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kodbox.podLabels" $sel | nindent 8 }}
      {{- with .Values.milvus.etcd.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "kodbox.podScheduling" $sel | nindent 6 }}
      containers:
        - name: etcd
          image: {{ include "kodbox.image" (dict "ctx" $ "image" $v.image) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          {{- with $v.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - etcd
            - -advertise-client-urls=http://{{ include "kodbox.componentName" $sel }}:2379
            - -listen-client-urls=http://0.0.0.0:2379
            - --data-dir=/etcd
          env:
            {{- range $k, $val := $v.env }}
            - name: {{ $k }}
              value: {{ $val | quote }}
            {{- end }}
            {{- with (include "kodbox.extraEnv" $sel | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          ports:
            - name: client
              containerPort: 2379
          {{- include "kodbox.probe" (dict "name" "startupProbe" "default" `` "override" $v.startupProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "livenessProbe" "default" `exec:
  command: ["etcdctl", "endpoint", "health"]
periodSeconds: 30
timeoutSeconds: 20` "override" $v.livenessProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "readinessProbe" "default" `exec:
  command: ["etcdctl", "endpoint", "health"]
periodSeconds: 10
timeoutSeconds: 20` "override" $v.readinessProbe) | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /etcd
          {{- with $v.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  # Keep data volumes when the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml $v.persistence.accessModes | nindent 10 }}
        {{- with $v.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $v.persistence.size }}
{{- end }}
