{{- $minReplicas := ternary .Values.app.autoscaling.minReplicas .Values.app.replicaCount .Values.app.autoscaling.enabled }}
{{- if and .Values.app.pdb.enabled (gt (int $minReplicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kodbox.componentName" (dict "ctx" . "component" "app") }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- include "kodbox.annotations" (dict "ctx" $ "extra" nil) | nindent 2 }}
spec:
  minAvailable: {{ .Values.app.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "kodbox.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
{{- end }}
