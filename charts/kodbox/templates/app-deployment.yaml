{{- include "kodbox.validate" . }}
{{- $sel := dict "ctx" . "component" "app" "v" .Values.app }}
{{- $image := include "kodbox.image" (dict "ctx" . "image" .Values.app.image "defaultTag" .Chart.AppVersion) }}
{{- $affinity := .Values.app.affinity }}
{{- if not $affinity }}
{{- $term := dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" (include "kodbox.selectorLabels" $sel | fromYaml)) }}
{{- if eq .Values.app.podAntiAffinity "hard" }}
{{- $affinity = dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list $term)) }}
{{- else if eq .Values.app.podAntiAffinity "soft" }}
{{- $affinity = dict "podAntiAffinity" (dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict "weight" 100 "podAffinityTerm" $term))) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- include "kodbox.annotations" (dict "ctx" $ "extra" nil) | nindent 2 }}
spec:
  revisionHistoryLimit: {{ include "kodbox.revisionHistoryLimit" . }}
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.app.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "kodbox.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kodbox.podLabels" $sel | nindent 8 }}
      annotations:
        # Checksum the configured values, not the rendered secret: generated
        # passwords are re-randomised on every render at install time.
        checksum/db-secret: {{ toYaml .Values.database | sha256sum }}
        # Only the ConfigMap's data: its labels carry the chart version, which
        # would restart the app on every chart upgrade.
        checksum/config: {{ (include (print $.Template.BasePath "/app-configmap.yaml") . | fromYaml).data | toYaml | sha256sum }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "kodbox.podScheduling" (merge (dict "affinity" $affinity) $sel) | nindent 6 }}
      terminationGracePeriodSeconds: {{ include "kodbox.appGracePeriod" . }}
      {{- if .Values.app.waitForDependencies }}
      # The image installs kodbox against the database on first start, so make
      # sure the database (and redis) accept connections before it runs.
      initContainers:
        - name: wait-for-deps
          image: {{ $image }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - php
            - -r
            - |
              foreach (array_filter(explode(' ', getenv('WAIT_FOR'))) as $target) {
                  [$host, $port] = explode(':', $target);
                  while (!($s = @fsockopen($host, (int) $port, $errno, $errstr, 3))) {
                      echo "waiting for $target: $errstr\n";
                      sleep(3);
                  }
                  fclose($s);
                  echo "$target is up\n";
              }
          env:
            - name: WAIT_FOR
              value: {{ printf "%s:%s" (include "kodbox.dbHost" .) (include "kodbox.dbPort" .) }}{{ with (include "kodbox.redisHost" .) }} {{ . }}:{{ include "kodbox.redisPort" $ }}{{ end }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      containers:
        - name: kodbox
          image: {{ $image }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MYSQL_HOST
              value: {{ include "kodbox.dbHost" . | quote }}
            - name: MYSQL_PORT
              value: {{ include "kodbox.dbPort" . | quote }}
            {{- with (include "kodbox.redisHost" .) }}
            - name: REDIS_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- if and (not .Values.redis.enabled) (or .Values.externalRedis.password .Values.externalRedis.existingSecret) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.externalRedis.existingSecret }}
                  name: {{ .Values.externalRedis.existingSecret }}
                  key: {{ .Values.externalRedis.existingSecretKey }}
                  {{- else }}
                  name: {{ include "kodbox.componentName" (dict "ctx" . "component" "redis") }}
                  key: REDIS_PASSWORD
                  {{- end }}
            {{- end }}
            {{- with (include "kodbox.extraEnv" $sel | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "kodbox.dbSecretName" . }}
            {{- if .Values.admin.bootstrap }}
            # Read by the image only when it installs kodbox into an empty volume.
            - secretRef:
                name: {{ include "kodbox.adminSecretName" . }}
            {{- end }}
          {{- if .Values.app.lifecycle }}
          lifecycle:
            {{- toYaml .Values.app.lifecycle | nindent 12 }}
          {{- else if ne (include "kodbox.appPreStopSleep" .) "0" }}
          # Keep serving while the Service and gateway stop routing to the pod;
          # then supervisord stops nginx and php-fpm gracefully (SIGQUIT).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ include "kodbox.appPreStopSleep" . }}"]
          {{- end }}
          ports:
            - name: http
              containerPort: 80
          # healthz.php exercises nginx + php-fpm without touching the database.
          # First start copies the kodbox source and runs the installer before
          # nginx starts, so allow up to 10 minutes.
          {{- include "kodbox.probe" (dict "name" "startupProbe" "default" `httpGet:
  path: /healthz.php
  port: http
periodSeconds: 10
failureThreshold: 60` "override" .Values.app.startupProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "livenessProbe" "default" `httpGet:
  path: /healthz.php
  port: http
periodSeconds: 20
timeoutSeconds: 5
failureThreshold: 3` "override" .Values.app.livenessProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "readinessProbe" "default" `httpGet:
  path: /healthz.php
  port: http
periodSeconds: 10
timeoutSeconds: 5` "override" .Values.app.readinessProbe) | nindent 10 }}
          volumeMounts:
            - name: site
              mountPath: /var/www/html
            # The image's entrypoint detects installs via config/version.php,
            # so this file in an empty volume doesn't block first-start setup.
            - name: healthz
              mountPath: /var/www/html/healthz.php
              subPath: healthz.php
              readOnly: true
            {{- if .Values.timezone }}
            - name: healthz
              mountPath: /usr/local/etc/php/conf.d/zz-timezone.ini
              subPath: zz-timezone.ini
              readOnly: true
            {{- end }}
            {{- with .Values.app.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with (include "kodbox.extraContainers" (dict "v" .Values.app) | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      volumes:
        - name: site
          {{- if .Values.app.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.app.persistence.existingClaim | default (include "kodbox.componentName" $sel) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: healthz
          configMap:
            name: {{ include "kodbox.componentName" $sel }}
        {{- with .Values.app.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
