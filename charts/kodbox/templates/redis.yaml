{{- if .Values.redis.enabled }}
{{- $sel := dict "ctx" . "component" "redis" "v" .Values.redis }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  {{- include "kodbox.annotations" (dict "ctx" $ "extra" .Values.redis.service.annotations) | nindent 2 }}
spec:
  selector:
    {{- include "kodbox.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  {{- include "kodbox.annotations" (dict "ctx" $ "extra" nil) | nindent 2 }}
spec:
  revisionHistoryLimit: {{ include "kodbox.revisionHistoryLimit" . }}
  serviceName: {{ include "kodbox.componentName" $sel }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kodbox.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kodbox.podLabels" $sel | nindent 8 }}
      {{- with .Values.redis.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "kodbox.podScheduling" $sel | nindent 6 }}
      containers:
        - name: redis
          image: {{ include "kodbox.image" (dict "ctx" $ "image" .Values.redis.image) }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- with .Values.redis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Leading "redis-server" lets the image's entrypoint fix /data ownership
          # and drop privileges; bare "--flag" args skip that.
          args:
            - redis-server
            {{- with .Values.redis.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (include "kodbox.extraEnv" $sel | trim) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
          {{- include "kodbox.probe" (dict "name" "startupProbe" "default" `` "override" .Values.redis.startupProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "livenessProbe" "default" `exec:
  command: ["redis-cli", "ping"]
periodSeconds: 20
timeoutSeconds: 5` "override" .Values.redis.livenessProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "readinessProbe" "default" `exec:
  command: ["redis-cli", "ping"]
periodSeconds: 10
timeoutSeconds: 5` "override" .Values.redis.readinessProbe) | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- with .Values.redis.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with (include "kodbox.extraContainers" (dict "v" .Values.redis) | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- if or (not .Values.redis.persistence.enabled) .Values.redis.persistence.existingClaim .Values.redis.extraVolumes }}
      volumes:
        {{- if not .Values.redis.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.redis.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.redis.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.redis.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if and .Values.redis.persistence.enabled (not .Values.redis.persistence.existingClaim) }}
  # Keep data volumes when the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.redis.persistence.accessModes | nindent 10 }}
        {{- include "kodbox.storageClass" (dict "ctx" $ "sc" .Values.redis.persistence.storageClass) | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
  {{- end }}
{{- end }}
