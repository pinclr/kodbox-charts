{{- if and .Values.kodoffice.enabled (include "kodbox.kodofficeJwt" .) (not .Values.kodoffice.jwt.existingSecret) }}
{{- $name := include "kodbox.kodofficeJwtSecretName" . }}
{{- $existing := (lookup "v1" "Secret" (include "kodbox.namespace" .) $name).data | default dict }}
{{- $secret := .Values.kodoffice.jwt.secret | default (get $existing "JWT_SECRET" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: kodoffice
  # Kept on uninstall: kodbox's onlyoffice plugin is configured with this secret.
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_SECRET: {{ $secret | b64enc | quote }}
{{- end }}
