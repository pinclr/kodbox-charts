{{- if not .Values.database.existingSecret }}
{{- $name := include "kodbox.dbSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $password := .Values.database.password | default (get $existing "MYSQL_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
{{- $rootPassword := .Values.database.rootPassword | default (get $existing "MYSQL_ROOT_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
  # Kept on uninstall like the data volumes, so a reinstall under the same
  # release name reads the passwords back and can still log in to the data.
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  MYSQL_DATABASE: {{ .Values.database.name | b64enc | quote }}
  MYSQL_USER: {{ .Values.database.user | b64enc | quote }}
  MYSQL_PASSWORD: {{ $password | b64enc | quote }}
  MYSQL_ROOT_PASSWORD: {{ $rootPassword | b64enc | quote }}
{{- end }}
