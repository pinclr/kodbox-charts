{{- if .Values.kodoffice.enabled }}
{{- $sel := dict "ctx" . "component" "kodoffice" "v" .Values.kodoffice }}
{{- $onlyoffice := eq .Values.kodoffice.edition "onlyoffice" }}
{{- $image := ternary .Values.kodoffice.onlyoffice.image .Values.kodoffice.image $onlyoffice }}
{{- $jwt := include "kodbox.kodofficeJwt" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: kodoffice
  {{- include "kodbox.annotations" (dict "ctx" $ "extra" .Values.kodoffice.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.kodoffice.service.type }}
  {{- with .Values.kodoffice.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "kodbox.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.kodoffice.service.port }}
      targetPort: http
      {{- if and (ne .Values.kodoffice.service.type "ClusterIP") .Values.kodoffice.service.nodePort }}
      nodePort: {{ .Values.kodoffice.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: kodoffice
  {{- include "kodbox.annotations" (dict "ctx" $ "extra" nil) | nindent 2 }}
spec:
  revisionHistoryLimit: {{ include "kodbox.revisionHistoryLimit" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kodbox.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kodbox.podLabels" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.kodoffice.onlyoffice.config | sha256sum }}
        checksum/jwt: {{ toYaml .Values.kodoffice.jwt | sha256sum }}
        {{- with .Values.kodoffice.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "kodbox.podScheduling" $sel | nindent 6 }}
      containers:
        - name: kodoffice
          image: {{ include "kodbox.image" (dict "ctx" $ "image" $image) }}
          imagePullPolicy: {{ $image.pullPolicy }}
          {{- with .Values.kodoffice.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: JWT_ENABLED
              value: {{ ternary "true" "false" (eq $jwt "true") | quote }}
            {{- if $jwt }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kodbox.kodofficeJwtSecretName" . }}
                  key: {{ ternary .Values.kodoffice.jwt.existingSecretKey "JWT_SECRET" (ne .Values.kodoffice.jwt.existingSecret "") }}
            {{- end }}
            {{- if $onlyoffice }}
            - name: ALLOW_PRIVATE_IP_ADDRESS
              value: {{ .Values.kodoffice.onlyoffice.allowPrivateIpAddress | toString | quote }}
            {{- end }}
            {{- with (include "kodbox.extraEnv" $sel | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
          # First start generates fonts and initialises the internal database.
          # The server briefly returns 502 while its internal services restart,
          # so liveness tolerates a few failures before restarting the pod.
          {{- include "kodbox.probe" (dict "name" "startupProbe" "default" `httpGet:
  path: /healthcheck
  port: http
periodSeconds: 10
failureThreshold: 60` "override" .Values.kodoffice.startupProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "livenessProbe" "default" `httpGet:
  path: /healthcheck
  port: http
periodSeconds: 20
timeoutSeconds: 5
failureThreshold: 6` "override" .Values.kodoffice.livenessProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "readinessProbe" "default" `httpGet:
  path: /healthcheck
  port: http
periodSeconds: 10
timeoutSeconds: 5` "override" .Values.kodoffice.readinessProbe) | nindent 10 }}
          {{- if or $onlyoffice .Values.kodoffice.extraVolumeMounts }}
          volumeMounts:
            {{- if $onlyoffice }}
            - name: config
              mountPath: /etc/onlyoffice/documentserver/local-production-linux.json
              subPath: local-production-linux.json
              readOnly: true
            {{- end }}
            {{- with .Values.kodoffice.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.kodoffice.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with (include "kodbox.extraContainers" (dict "v" .Values.kodoffice) | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- if or $onlyoffice .Values.kodoffice.extraVolumes }}
      volumes:
        {{- if $onlyoffice }}
        - name: config
          configMap:
            name: {{ include "kodbox.componentName" $sel }}
        {{- end }}
        {{- with .Values.kodoffice.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
