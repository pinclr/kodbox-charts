{{- if .Values.milvus.enabled }}
{{- $name := include "kodbox.componentName" (dict "ctx" . "component" "milvus") }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $minioPassword := .Values.milvus.minio.rootPassword | default (get $existing "MINIO_ROOT_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: milvus
  # Kept on uninstall like the data volumes, so a reinstall under the same
  # release name reads the passwords back and can still log in to the data.
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.milvus.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $minioPassword | quote }}
  # Milvus overlays configs/user.yaml on top of its bundled milvus.yaml.
  user.yaml: |
    etcd:
      endpoints:
        - {{ include "kodbox.componentName" (dict "ctx" . "component" "etcd") }}:2379
    minio:
      address: {{ include "kodbox.componentName" (dict "ctx" . "component" "minio") }}
      port: 9000
      accessKeyID: {{ .Values.milvus.minio.rootUser | quote }}
      secretAccessKey: {{ $minioPassword | quote }}
{{- end }}
