apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kodbox.componentName" (dict "ctx" . "component" "app") }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
data:
  healthz.php: |
    <?php
    header('Content-Type: text/plain');
    header('Cache-Control: no-store');
    echo 'ok';
  {{- with .Values.timezone }}
  # PHP ignores TZ; kodbox's dates follow date.timezone.
  zz-timezone.ini: |
    date.timezone = {{ . }}
  {{- end }}
