{{- if .Values.milvus.enabled }}
{{- $sel := dict "ctx" . "component" "minio" "v" .Values.milvus.minio }}
{{- $v := .Values.milvus.minio }}
{{- /*
S3 object storage for Milvus. The component keeps the name "minio" (service,
values, Milvus' minio.* settings), but runs RustFS since chart 0.5.0: MinIO's
community images are gone. RustFS can't use MinIO's data, so an upgrade with
the old MinIO StatefulSet still in place is refused; see README "Upgrades".
*/}}
{{- $name := include "kodbox.componentName" $sel }}
{{- $old := lookup "apps/v1" "StatefulSet" (include "kodbox.namespace" .) $name }}
{{- if $old }}
{{- $oldImage := (first $old.spec.template.spec.containers).image }}
{{- if contains "minio" (regexReplaceAll ".*/" $oldImage "") }}
{{- fail (printf "Milvus object storage moves from MinIO to RustFS in this chart version and needs a one-time reset of the Milvus stack (StatefulSet %s still runs %s). Follow the chart README, 'Upgrades' > 'Milvus: MinIO to RustFS', first." $name $oldImage) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    {{- include "kodbox.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "kodbox.componentName" $sel }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kodbox.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kodbox.podLabels" $sel | nindent 8 }}
      annotations:
        checksum/milvus-secret: {{ pick .Values.milvus.minio "rootUser" "rootPassword" "existingSecret" | toYaml | sha256sum }}
        {{- with .Values.milvus.minio.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "kodbox.podScheduling" $sel | nindent 6 }}
      containers:
        - name: minio
          image: {{ include "kodbox.image" (dict "ctx" $ "image" $v.image) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          {{- with $v.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # Data in a subdirectory of the volume, owned by the rustfs user.
            - name: RUSTFS_VOLUMES
              value: /data/rustfs
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: 0.0.0.0:9001
            # Empty: log to stdout instead of files in the container.
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kodbox.milvusSecretName" . }}
                  key: MINIO_ROOT_USER
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kodbox.milvusSecretName" . }}
                  key: MINIO_ROOT_PASSWORD
            {{- with (include "kodbox.extraEnv" $sel | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          {{- include "kodbox.probe" (dict "name" "startupProbe" "default" `` "override" $v.startupProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "livenessProbe" "default" `httpGet:
  path: /health
  port: api
periodSeconds: 30
timeoutSeconds: 20` "override" $v.livenessProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "readinessProbe" "default" `httpGet:
  path: /health/ready
  port: api
periodSeconds: 10` "override" $v.readinessProbe) | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with $v.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  # Keep data volumes when the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml $v.persistence.accessModes | nindent 10 }}
        {{- with $v.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $v.persistence.size }}
{{- end }}
