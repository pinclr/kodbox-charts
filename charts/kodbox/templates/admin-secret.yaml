{{- if and .Values.admin.bootstrap (not .Values.admin.existingSecret) }}
{{- $name := include "kodbox.adminSecretName" . }}
{{- $existing := (lookup "v1" "Secret" (include "kodbox.namespace" .) $name).data | default dict }}
{{- /* Guarantee upper, lower and digit so kodbox's default password rule passes. */}}
{{- $generated := printf "%s%s%s%s" (randAlpha 1 | upper) (randAlpha 1 | lower) (randNumeric 1) (randAlphaNum 21) }}
{{- $password := .Values.admin.password | default (get $existing "KODBOX_ADMIN_PASSWORD" | b64dec) | default $generated }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  # Kept on uninstall like the data volumes, so a reinstall under the same
  # release name reads the passwords back and can still log in to the data.
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  KODBOX_ADMIN_USER: {{ .Values.admin.username | b64enc | quote }}
  KODBOX_ADMIN_PASSWORD: {{ $password | b64enc | quote }}
{{- end }}
