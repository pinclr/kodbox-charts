{{- if .Values.imaginary.enabled }}
{{- $sel := dict "ctx" . "component" "imaginary" "v" .Values.imaginary }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: imaginary
spec:
  selector:
    {{- include "kodbox.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.imaginary.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: imaginary
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kodbox.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kodbox.podLabels" $sel | nindent 8 }}
      {{- with .Values.imaginary.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "kodbox.podScheduling" $sel | nindent 6 }}
      containers:
        - name: imaginary
          image: {{ include "kodbox.image" (dict "ctx" $ "image" .Values.imaginary.image) }}
          imagePullPolicy: {{ .Values.imaginary.image.pullPolicy }}
          {{- with .Values.imaginary.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.imaginary.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PORT
              value: {{ .Values.imaginary.port | quote }}
            {{- with (include "kodbox.extraEnv" $sel | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.imaginary.port }}
          {{- include "kodbox.probe" (dict "name" "startupProbe" "default" `` "override" .Values.imaginary.startupProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "livenessProbe" "default" `httpGet:
  path: /health
  port: http
periodSeconds: 20` "override" .Values.imaginary.livenessProbe) | nindent 10 }}
          {{- include "kodbox.probe" (dict "name" "readinessProbe" "default" `httpGet:
  path: /health
  port: http
periodSeconds: 10` "override" .Values.imaginary.readinessProbe) | nindent 10 }}
          {{- with .Values.imaginary.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
