{{- $sel := dict "ctx" . "component" "app" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kodbox.componentName" $sel }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "kodbox.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
