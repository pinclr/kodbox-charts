{{- if .Values.networkPolicy.enabled }}
{{- $rules := list }}
{{- $metrics := eq (include "kodbox.metricsEnabled" .) "true" }}
{{- $metricsFrom := .Values.networkPolicy.metricsFrom | default (list) }}
{{- if .Values.db.enabled }}
{{- $rules = append $rules (dict "target" "db" "from" (ternary (list "app" "backup") (list "app") .Values.backup.enabled) "ports" (list 3306) "scrapePort" (ternary 9104 0 $metrics) "scrapeFrom" $metricsFrom) }}
{{- end }}
{{- if .Values.redis.enabled }}
{{- $rules = append $rules (dict "target" "redis" "from" (list "app") "ports" (list 6379) "scrapePort" (ternary 9121 0 $metrics) "scrapeFrom" $metricsFrom) }}
{{- end }}
{{- if .Values.imaginary.enabled }}
{{- $rules = append $rules (dict "target" "imaginary" "from" (list "app") "ports" (list (int .Values.imaginary.port))) }}
{{- end }}
{{- if .Values.milvus.enabled }}
{{- $rules = append $rules (dict "target" "etcd" "from" (list "milvus") "ports" (list 2379)) }}
{{- $rules = append $rules (dict "target" "minio" "from" (list "milvus") "ports" (list 9000)) }}
{{- $rules = append $rules (dict "target" "milvus" "from" (list "app") "ports" (list 19530 9091) "extraFrom" .Values.networkPolicy.milvusExtraFrom "scrapePort" (ternary 9091 0 $metrics) "scrapeFrom" $metricsFrom) }}
{{- end }}
{{- range $rules }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kodbox.componentName" (dict "ctx" $ "component" .target) }}
  namespace: {{ include "kodbox.namespace" $ }}
  labels:
    {{- include "kodbox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .target }}
  {{- include "kodbox.annotations" (dict "ctx" $ "extra" nil) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kodbox.selectorLabels" (dict "ctx" $ "component" .target) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .from }}
        - podSelector:
            matchLabels:
              {{- include "kodbox.selectorLabels" (dict "ctx" $ "component" .) | nindent 14 }}
        {{- end }}
        {{- with .extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- if .scrapePort }}
    {{- $peers := concat .scrapeFrom (.extraFrom | default (list)) }}
    {{- if $peers }}
    - from:
        {{- range $peers }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .scrapePort }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
