{{- if .Values.gateway.enabled }}
{{- $gw := .Values.gateway }}
{{- $fullname := include "kodbox.fullname" . }}
{{- $routes := list (dict "component" "app" "hostnames" $gw.app.hostnames) }}
{{- if and .Values.kodoffice.enabled $gw.kodoffice.hostnames }}
{{- $routes = append $routes (dict "component" "kodoffice" "hostnames" $gw.kodoffice.hostnames) }}
{{- end }}
{{- $allHostnames := list }}
{{- range $routes }}{{ $allHostnames = concat $allHostnames .hostnames }}{{ end }}
{{- if $gw.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "kodbox.labels" . | nindent 4 }}
  {{- with $gw.gatewayAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $gw.className }}
  listeners:
    {{- range $i, $host := $allHostnames }}
    - name: http-{{ $i }}
      protocol: HTTP
      port: 80
      hostname: {{ $host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-{{ $i }}
      protocol: HTTPS
      port: 443
      hostname: {{ $host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ required "gateway.tlsSecretName is required when gateway.create=true" $gw.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
{{- end }}
{{- range $routes }}
{{- $svc := include "kodbox.componentName" (dict "ctx" $ "component" .component) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $svc }}
  labels:
    {{- include "kodbox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
  {{- with $gw.routeAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if $gw.create }}
    {{- range $i, $host := $allHostnames }}
    - name: {{ $fullname }}
      sectionName: https-{{ $i }}
    {{- end }}
    {{- else }}
    {{- toYaml $gw.parentRefs | nindent 4 }}
    {{- end }}
  hostnames:
    {{- toYaml .hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $svc }}
          port: {{ ternary $.Values.app.service.port $.Values.kodoffice.service.port (eq .component "app") }}
      {{- with $gw.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if $gw.httpsRedirect.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $svc }}-redirect
  labels:
    {{- include "kodbox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  parentRefs:
    {{- if $gw.create }}
    {{- range $i, $host := $allHostnames }}
    - name: {{ $fullname }}
      sectionName: http-{{ $i }}
    {{- end }}
    {{- else }}
    {{- $refs := list }}
    {{- range $gw.parentRefs }}
    {{- $refs = append $refs (merge (dict "sectionName" $gw.httpsRedirect.sectionName) (omit . "sectionName")) }}
    {{- end }}
    {{- toYaml $refs | nindent 4 }}
    {{- end }}
  hostnames:
    {{- toYaml .hostnames | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
{{- end }}
{{- end }}
{{- end }}
