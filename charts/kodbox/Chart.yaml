  artifacthub.io/changes: |
    - kind: added
      description: Graceful app shutdown, a 10s preStop sleep and a 60s termination grace period (app.preStopSleepSeconds, app.terminationGracePeriodSeconds, app.lifecycle)
    - kind: added
      description: milvus.minio.existingSecret for the RustFS/Milvus object storage credentials
    - kind: changed
      description: Milvus reads the object storage credentials from its environment; its user.yaml moved to a ConfigMap without credentials
    - kind: fixed
      description: 0.7.1's changelog entry was malformed; CI now validates artifacthub.io/changes
