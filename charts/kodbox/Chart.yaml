apiVersion: v2
name: kodbox
description: Kodbox web file manager with MariaDB, Redis, KodOffice and Imaginary
type: application
version: 0.10.0
appVersion: "1.68.10"
kubeVersion: ">=1.27.0-0"
home: https://github.com/pinclr/kodbox-charts
icon: https://raw.githubusercontent.com/pinclr/kodbox-charts/main/assets/kodbox.png
sources:
  - https://github.com/pinclr/kodbox-charts
  - https://github.com/kalcaddle/kodbox
keywords:
  - kodbox
  - file-manager
  - cloud-storage
  - office
maintainers:
  - name: pinclr
    url: https://github.com/pinclr
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: storage
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/pinclr/kodbox-charts
    - name: kodbox
      url: https://kodcloud.com
  artifacthub.io/changes: |
    - kind: added
      description: metrics.enabled - Prometheus endpoints for the app (php-fpm status, nginx exporter), db (mysqld_exporter) and redis (redis_exporter); milvus already serves its own
    - kind: added
      description: metrics.podMonitor.enabled - one PodMonitor per component (needs the Prometheus Operator)
    - kind: added
      description: networkPolicy.metricsFrom - who may scrape the db, redis and milvus metrics ports
    - kind: added
      description: the db exporter logs in with its own MariaDB account, created by a post-install,post-upgrade hook Job
  artifacthub.io/signKey: |
    fingerprint: A0789F533FF3502789281476AA27ACFF8DC3E405
    url: https://raw.githubusercontent.com/pinclr/kodbox-charts/main/signing-key.asc
