apiVersion: v2
name: kodbox
description: Kodbox web file manager with MariaDB, Redis, KodOffice and Imaginary
type: application
version: 0.4.4
appVersion: "1.68.10"
kubeVersion: ">=1.27.0-0"
home: https://github.com/pinclr/kodbox-charts
icon: https://raw.githubusercontent.com/pinclr/kodbox-charts/main/assets/kodbox.png
sources:
  - https://github.com/pinclr/kodbox-charts
  - https://github.com/kalcaddle/kodbox
keywords:
  - kodbox
  - file-manager
  - cloud-storage
  - office
maintainers:
  - name: pinclr
    url: https://github.com/pinclr
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: storage
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/pinclr/kodbox-charts
    - name: kodbox
      url: https://kodcloud.com
  artifacthub.io/changes: |
    - kind: security
      description: MariaDB moves to the official docker.io/library/mariadb:12.3.3 image (same version as the previous kodcloud/mariadb:lts)
    - kind: security
      description: Redis moves to the official docker.io/library/redis:8.10.2-alpine image (same version as the previous kodcloud/redis:alpine)
    - kind: security
      description: Imaginary moves to Nextcloud's maintained docker.io/nextcloud/aio-imaginary build, replacing an outdated copy with critical CVEs
    - kind: security
      description: Imaginary runs as non-root with all capabilities dropped (Pod Security "restricted")
    - kind: added
      description: CI scans every image with Trivy and reports CRITICAL/HIGH counts
  artifacthub.io/signKey: |
    fingerprint: A0789F533FF3502789281476AA27ACFF8DC3E405
    url: https://raw.githubusercontent.com/pinclr/kodbox-charts/main/signing-key.asc
