name: Bug report
description: Something in the chart doesn't work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Chart version
      placeholder: "0.7.0"
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version and distribution
      placeholder: "1.31, k3s / EKS / ACK / ..."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Values you changed (remove secrets)
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (helm, kubectl describe / logs)
      render: text
