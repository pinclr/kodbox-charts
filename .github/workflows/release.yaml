name: Release charts

# Publishes every chart whose Chart.yaml version has no release yet:
# a GitHub Release (tag <chart>-<version>) with the GPG-signed .tgz, an updated
# index.yaml on gh-pages (https://pinclr.github.io/kodbox-charts), and an OCI
# artifact on GHCR (oci://ghcr.io/pinclr/charts/<chart>) signed with cosign.
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "artifacthub-repo.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write   # push charts to GHCR
  id-token: write   # keyless cosign signing (GitHub OIDC)

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v4

      # Packages are signed with the "pinclr Helm charts" GPG key; chart-releaser
      # uploads the .prov provenance file next to each .tgz. Public key:
      # signing-key.asc (fingerprint A0789F533FF3502789281476AA27ACFF8DC3E405).
      - name: Prepare signing key
        env:
          GPG_KEYRING_BASE64: ${{ secrets.GPG_KEYRING_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_KEYRING_BASE64" | base64 -d > "$RUNNER_TEMP/secring.gpg"
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/passphrase"

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_GENERATE_RELEASE_NOTES: true
          CR_SIGN: true
          CR_KEY: pinclr Helm charts
          CR_KEYRING: ${{ runner.temp }}/secring.gpg
          CR_PASSPHRASE_FILE: ${{ runner.temp }}/passphrase

      - uses: sigstore/cosign-installer@v4.1.2
        if: steps.cr.outputs.changed_charts != ''

      # Same packages as OCI artifacts on GHCR, signed keylessly: the signature
      # names this workflow on main, recorded in Sigstore's transparency log.
      # Versions already on GHCR are skipped, so OCI tags never change.
      - name: Push charts to GHCR and sign with cosign
        if: steps.cr.outputs.changed_charts != ''
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for pkg in .cr-release-packages/*.tgz; do
            name=$(helm show chart "$pkg" | sed -n 's/^name: //p')
            version=$(helm show chart "$pkg" | sed -n 's/^version: //p')
            if helm show chart "oci://$registry/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name $version already on GHCR, skipping"
              continue
            fi
            out=$(helm push "$pkg" "oci://$registry" 2>&1)
            echo "$out"
            digest=$(echo "$out" | sed -n 's/^Digest: //p')
            cosign sign --yes "$registry/$name@$digest"
          done

      # Artifact Hub reads artifacthub-repo.yml from the root of the Helm repo,
      # i.e. next to index.yaml on gh-pages.
      - name: Sync artifacthub-repo.yml to gh-pages
        run: |
          if ! grep -qv '^\s*\(#\|$\)' artifacthub-repo.yml; then
            echo "artifacthub-repo.yml has no settings yet, skipping"
            exit 0
          fi
          git fetch origin gh-pages
          git worktree add ../gh-pages origin/gh-pages
          cp artifacthub-repo.yml ../gh-pages/artifacthub-repo.yml
          cd ../gh-pages
          if git diff --quiet --exit-code -- artifacthub-repo.yml && git ls-files --error-unmatch artifacthub-repo.yml >/dev/null 2>&1; then
            echo "artifacthub-repo.yml unchanged"
            exit 0
          fi
          git add artifacthub-repo.yml
          git commit -m "Update artifacthub-repo.yml"
          git push origin HEAD:gh-pages
