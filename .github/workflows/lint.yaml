name: Lint and test charts

on:
  pull_request:
    paths:
      - "charts/**"
      - "ct.yaml"
      - "scripts/**"
      - ".github/workflows/lint.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # yamale in chart-testing breaks on 3.14

      - uses: helm/chart-testing-action@v2.7.0

      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # values.schema.json and the README's values reference are generated;
      # fail if they weren't regenerated after a change.
      - name: Check generated files are up to date
        run: |
          pip install --quiet pyyaml
          python3 scripts/gen_values_schema.py
          python3 scripts/gen_values_doc.py
          git diff --exit-code -- charts/*/values.schema.json charts/*/README.md \
            || { echo "::error::Run scripts/gen_values_schema.py and scripts/gen_values_doc.py and commit the result"; exit 1; }

      # Fails if a changed chart doesn't bump its Chart.yaml version, so every
      # merge to main produces a new release.
      - name: Lint changed charts
        run: ct lint --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Render changed charts
        run: |
          for chart in $(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}); do
            echo "::group::$chart"
            helm template ci "$chart" > /dev/null
            helm template ci "$chart" -f "$chart/values-production.yaml" > /dev/null
            helm template ci "$chart" --set gateway.enabled=true --set gateway.create=true --set gateway.tlsSecretName=tls > /dev/null
            helm template ci "$chart" --set ingress.enabled=true --set milvus.enabled=true > /dev/null
            echo "::endgroup::"
          done

  # Installs each changed chart on a throwaway kind cluster, once per
  # ci/*-values.yaml, tests an upgrade from the released version, and runs
  # `helm test`.
  install:
    needs: lint
    if: needs.lint.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # yamale in chart-testing breaks on 3.14

      - uses: helm/chart-testing-action@v2.7.0

      - uses: helm/kind-action@v1.12.0

      # Pods must pass the Pod Security "baseline" standard; "restricted"
      # violations are only reported as warnings.
      - name: Create namespace enforcing Pod Security baseline
        run: |
          kubectl create namespace kodbox-ci
          kubectl label namespace kodbox-ci \
            pod-security.kubernetes.io/enforce=baseline \
            pod-security.kubernetes.io/warn=restricted

      # Password-protected Redis for ci/external-redis-values.yaml.
      - name: Start external Redis
        run: |
          kubectl -n kodbox-ci create deployment redis-ext --image=redis:7-alpine --port=6379 \
            -- redis-server --requirepass ci-redis-pass
          kubectl -n kodbox-ci expose deployment redis-ext --port=6379
          kubectl -n kodbox-ci rollout status deployment/redis-ext --timeout=180s

      # Fresh install of each ci/*-values.yaml, then an in-place upgrade from the
      # chart on the target branch (values files new in this change are skipped
      # for the upgrade).
      - name: Install and upgrade changed charts, run helm test
        run: >-
          ct install --config ct.yaml --namespace kodbox-ci
          --upgrade --skip-missing-values
          --target-branch ${{ github.event.repository.default_branch }}

      # Runs the real backup CronJob three times with keep=2 (each run must write a
      # dump, the third must prune the oldest), then restores the newest dump
      # with the README's commands and checks a marker row survives.
      - name: Test database backup and restore
        run: |
          ns=backup-ci
          db() { kubectl -n $ns exec bk-kodbox-db-0 -- sh -c "mariadb -uroot -p\"\$MYSQL_ROOT_PASSWORD\" kodbox -N -e \"$1\""; }
          kubectl create namespace $ns
          helm install bk charts/kodbox -n $ns \
            --set kodoffice.enabled=false --set imaginary.enabled=false \
            --set backup.enabled=true --set backup.keep=2 --set timezone=Asia/Shanghai
          kubectl -n $ns rollout status statefulset/bk-kodbox-db --timeout=300s
          db "CREATE TABLE ci_marker (v VARCHAR(32)); INSERT INTO ci_marker VALUES ('restored-ok');"

          for run in 1 2 3; do
            kubectl -n $ns create job "backup-$run" --from=cronjob/bk-kodbox-backup
            kubectl -n $ns wait --for=condition=complete "job/backup-$run" --timeout=300s
            kubectl -n $ns logs "job/backup-$run"
            sleep 2
          done
          kubectl -n $ns logs job/backup-3 | grep -q "^removed '/backup/kodbox-" \
            || { echo "::error::third backup run did not prune the oldest dump"; exit 1; }

          db "DROP TABLE ci_marker;"
          kubectl -n $ns scale deployment/bk-kodbox-app --replicas=0
          kubectl -n $ns apply -f - <<'YAML'
          apiVersion: v1
          kind: Pod
          metadata:
            name: bk-restore
          spec:
            securityContext: {runAsUser: 999, runAsGroup: 999, fsGroup: 999}
            containers:
              - name: restore
                image: docker.io/library/mariadb:12.3.3
                command: ["sleep", "infinity"]
                volumeMounts: [{name: backup, mountPath: /backup}]
            volumes:
              - name: backup
                persistentVolumeClaim: {claimName: bk-kodbox-backup}
          YAML
          kubectl -n $ns wait --for=condition=Ready pod/bk-restore --timeout=180s
          kubectl -n $ns exec bk-restore -- ls -lt /backup
          [ "$(kubectl -n $ns exec bk-restore -- sh -c 'ls /backup/*.sql.gz | wc -l')" -eq 2 ] \
            || { echo "::error::expected exactly 2 dumps after pruning"; exit 1; }
          latest=$(kubectl -n $ns exec bk-restore -- sh -c 'ls -1t /backup/*.sql.gz | head -1')
          kubectl -n $ns exec bk-restore -- cat "$latest" \
            | gunzip \
            | kubectl -n $ns exec -i bk-kodbox-db-0 -- sh -c 'mariadb -uroot -p"$MYSQL_ROOT_PASSWORD"'
          [ "$(db 'SELECT v FROM ci_marker;')" = "restored-ok" ] \
            || { echo "::error::marker row missing after restore"; exit 1; }
          echo "backup and restore OK"
          kubectl -n $ns scale deployment/bk-kodbox-app --replicas=1
          kubectl -n $ns rollout status deployment/bk-kodbox-app --timeout=600s
          helm test bk -n $ns --logs

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
          kubectl -n kodbox-ci get replicasets,statefulsets -o wide
          for pod in $(kubectl get pods -A -l app.kubernetes.io/name=kodbox -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'); do
            echo "::group::logs $pod"
            kubectl logs -n "${pod%/*}" "${pod#*/}" --all-containers --tail=100 || true
            echo "::endgroup::"
          done

  # Scans every image the chart deploys (defaults plus Milvus) with Trivy and
  # writes a CRITICAL/HIGH summary to the job summary. Report only: some images
  # (kodbox, kodoffice) can only be fixed upstream.
  image-scan:
    needs: lint
    if: needs.lint.outputs.changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # Public release download; aquasecurity's IP allow list blocks token API calls.
      - name: Install Trivy
        run: |
          version=$(curl -fsSI https://github.com/aquasecurity/trivy/releases/latest \
            | sed -n 's|^location: .*/tag/v\([0-9.]*\).*|\1|Ip' | tr -d '\r')
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin trivy
          trivy --version

      - name: Scan chart images
        run: |
          images=$(helm template scan charts/kodbox --set milvus.enabled=true \
            | sed -n 's/^ *image: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | sort -u)
          {
            echo "### Image vulnerabilities (fixable / all)"
            echo
            echo "| Image | Critical | High |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for image in $images; do
            echo "::group::$image"
            if trivy image --quiet --scanners vuln --severity CRITICAL,HIGH \
                 --format json --output scan.json "$image"; then
              read -r crit_fix crit high_fix high < <(jq -r '
                [.Results[]?.Vulnerabilities[]?] as $v
                | [($v | map(select(.Severity=="CRITICAL" and .FixedVersion)) | length),
                   ($v | map(select(.Severity=="CRITICAL")) | length),
                   ($v | map(select(.Severity=="HIGH" and .FixedVersion)) | length),
                   ($v | map(select(.Severity=="HIGH")) | length)] | @tsv' scan.json)
              echo "| \`$image\` | $crit_fix / $crit | $high_fix / $high |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$image\` | scan failed | |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          cat "$GITHUB_STEP_SUMMARY"
